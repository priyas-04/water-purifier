name: water_purifier_app
description: "AquaPure - Commercial Water Purifier E-Commerce, Service Booking & Dealer Ordering App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture
  provider: ^6.1.1
  go_router: ^13.2.0

  # Firebase Suite
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_messaging: ^14.7.19

  # UI, Icons, Typography & Animations
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0

  # Payment Gateway
  razorpay_flutter: ^1.3.6

  # Utilities & Networking
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/products.json
    - assets/images/
